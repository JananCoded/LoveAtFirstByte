<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Made with Love</title>

    <!-- Instagram & Facebook Open Graph Preview Metadata -->
    <meta property="og:title" content="Made with Love">
    <meta property="og:description" content="A simple, lightning-fast beautiful page filled with love.">
    <!-- Paste your external heart image link in the content attribute below -->
    <meta property="og:image" content=" https://lunchroom-unholy-answering.ngrok-free.dev">
    <meta property="og:type" content="website">

    <!-- Ultra-light, modern CSS (Less than 1KB) -->
    <style>
        :root {
            --bg-color: #fafafa;
            --text-color: #333;
            --accent-color: #ff4d6d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 400px;
            animation: fadeIn 1s ease-in-out;
        }
        .heart-image {
            max-width: 150px;
            height: auto;
            border-radius: 20px;
            transition: transform 0.3s ease;
        }
        .heart-image:hover {
            transform: scale(1.1);
        }
        h1 {
            font-size: 2rem;
            margin: 20px 0 10px;
            font-weight: 700;
        }
        p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.5;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Paste your external heart image link in the src attribute below -->
        <img class="heart-image" src="YOUR_EXTERNAL_IMAGE_URL" alt="Love Heart">
        <h1>What I Love</h1>
        <p>Keeping things simple, lightweight, and beautiful.</p>
    </div>

</body>
</html>
